<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17131f">
  <meta name="description" content="Enciende una vela virtual, pide un deseo y guárdalo en tu corazón.">
  <title>Un deseo · Vela virtual</title>
  <style>
    :root { color-scheme:light; --ink:#426982; --muted:#708b9b; --gold:#d6a94e; --pink:#ffb7aa; }
    * { box-sizing:border-box }
    body { position:relative; margin:0; min-height:100svh; display:grid; place-items:center; padding:24px; color:var(--ink); font-family:ui-serif, Georgia, serif; background:#fff; }
    main { position:relative; z-index:1; width:min(100%,520px); text-align:center; }
    .decor { position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0; }
    .decor span { position:absolute; display:block; line-height:1; user-select:none; }
    .star { color:#d7aa50; text-shadow:0 1px 0 #f6e8c7; }
    .heart { color:#6f9fbd; }
    .decor span:nth-child(1) { top:7%; left:9%; font-size:13px }
    .decor span:nth-child(2) { top:12%; right:12%; font-size:11px }
    .decor span:nth-child(3) { top:25%; left:5%; font-size:10px }
    .decor span:nth-child(4) { top:31%; right:6%; font-size:13px }
    .decor span:nth-child(5) { top:47%; left:11%; font-size:12px }
    .decor span:nth-child(6) { top:55%; right:10%; font-size:10px }
    .decor span:nth-child(7) { top:70%; left:6%; font-size:11px }
    .decor span:nth-child(8) { top:78%; right:6%; font-size:13px }
    .decor span:nth-child(9) { bottom:8%; left:18%; font-size:10px }
    .decor span:nth-child(10) { bottom:7%; right:20%; font-size:11px }
    .decor span:nth-child(11) { top:4%; left:46%; font-size:9px }
    .decor span:nth-child(12) { top:18%; left:23%; font-size:10px }
    .decor span:nth-child(13) { top:20%; right:28%; font-size:9px }
    .decor span:nth-child(14) { top:38%; left:8%; font-size:11px }
    .decor span:nth-child(15) { top:42%; right:14%; font-size:9px }
    .decor span:nth-child(16) { top:61%; left:19%; font-size:9px }
    .decor span:nth-child(17) { top:64%; right:20%; font-size:11px }
    .decor span:nth-child(18) { top:83%; left:10%; font-size:9px }
    .decor span:nth-child(19) { top:88%; right:12%; font-size:10px }
    .decor span:nth-child(20) { bottom:3%; left:49%; font-size:9px }
    .decor span:nth-child(21) { top:52%; left:4%; font-size:9px }
    .decor span:nth-child(22) { top:73%; right:4%; font-size:9px }
    .eyebrow { margin:0 0 12px; color:var(--gold); font:600 .76rem/1.4 system-ui,sans-serif; letter-spacing:.22em; text-transform:uppercase }
    h1 { margin:0; font-size:clamp(2.25rem,8vw,3.8rem); font-weight:400; letter-spacing:-.04em }
    .intro { margin:12px auto 0; max-width:340px; color:var(--muted); font:1rem/1.65 system-ui,sans-serif }
    .scene { position:relative; height:310px; margin:4px auto 0; display:grid; place-items:center; isolation:isolate; }
    .glow { position:absolute; width:200px; height:200px; border-radius:50%; background:#f4d78e; filter:blur(62px); opacity:0; transition:opacity .7s ease; z-index:-1 }
    .lit .glow { opacity:.34 }
    .candle-button { position:relative; width:150px; height:245px; padding:0; border:0; background:transparent; cursor:pointer; -webkit-tap-highlight-color:transparent; }
    .candle-button:focus-visible { outline:2px solid var(--gold); outline-offset:12px; border-radius:40px }
    .flame { position:absolute; top:8px; left:50%; width:38px; height:61px; transform:translateX(-50%) scale(.2); transform-origin:50% 90%; opacity:0; border-radius:55% 45% 52% 48% / 68% 68% 32% 32%; background:radial-gradient(ellipse at 50% 72%,#fffdf0 0 16%,#ffe9ad 34%,#edbd68 65%,#cf9552 100%); filter:drop-shadow(0 0 12px #e5c77e) drop-shadow(0 0 26px #e5c77e); transition:opacity .35s,transform .45s cubic-bezier(.2,.8,.2,1.3); }
    .lit .flame { opacity:1; transform:translateX(-50%) scale(1); animation:flicker 1.7s ease-in-out infinite alternate; }
    .flame:after { content:""; position:absolute; inset:12px 11px 12px; border-radius:inherit; background:#fffdf0; filter:blur(3px); }
    .wick { position:absolute; z-index:2; top:65px; left:50%; width:3px; height:18px; transform:translateX(-50%); border-radius:3px; background:#775c49; }
    .wax { position:absolute; top:79px; left:50%; width:106px; height:145px; transform:translateX(-50%); border:1px solid #d7c8a9; border-radius:13px 13px 10px 10px / 8px 8px 12px 12px; background:linear-gradient(90deg,#f1eadc,#fffdf7 30%,#fff 55%,#f1e9d8 100%); box-shadow:inset 7px 0 12px #fff,inset -8px 0 12px #b9a77d1f,0 16px 30px #526e7a18; }
    .wax:before { content:""; position:absolute; top:-5px; left:0; width:100%; height:15px; border:1px solid #d7c8a9; border-radius:50%; background:linear-gradient(90deg,#f1eadc,#fffdf7 45%,#eee5d1); }
    .drip { position:absolute; top:79px; left:calc(50% + 21px); width:13px; height:34px; border-radius:0 0 9px 9px; background:#f5eddf; box-shadow:inset -3px 0 4px #ad956c20; }
    .base { position:absolute; top:216px; left:50%; width:142px; height:18px; transform:translateX(-50%); border-radius:50%; background:radial-gradient(ellipse,#e7d8bd 0 50%,#d0bb96 72%,transparent 74%); opacity:.62 }
    .tap-hint { position:absolute; top:250px; left:0; width:100%; color:#648198; font: .82rem system-ui,sans-serif; opacity:.9 }
    .wish { width:min(100%,360px); margin:auto; text-align:left; }
    .wish label { display:block; margin:0 0 7px; color:#426982; font: .92rem system-ui,sans-serif }
    input,textarea { display:block; width:100%; margin:0 0 14px; padding:13px 15px; color:#355a73; font: .95rem/1.5 system-ui,sans-serif; background:#fff; border:1px solid #b9cbd5; border-radius:14px; outline:none; }
    textarea { min-height:84px; resize:vertical; }
    input:focus,textarea:focus { border-color:#ffd79699 }
    input::placeholder,textarea::placeholder { color:#8299a8 }
    .save-button { display:block; width:100%; padding:12px 16px; color:#fff; font:600 .95rem system-ui,sans-serif; background:#547e98; border:0; border-radius:999px; cursor:pointer; }
    .save-button:disabled { opacity:.55; cursor:wait }
    .status { min-height:1.5em; margin:10px 0 0; color:#426982; text-align:center; font: .84rem/1.5 system-ui,sans-serif }
    .honeypot { position:absolute!important; width:1px!important; height:1px!important; padding:0!important; margin:-1px!important; overflow:hidden!important; clip:rect(0,0,0,0)!important; white-space:nowrap!important; border:0!important; }
    .note { margin:12px 0 0; color:#718797; font: .75rem/1.5 system-ui,sans-serif }
    @keyframes flicker { from { transform:translateX(-50%) rotate(-2deg) scale(.98,1.02) } to { transform:translateX(-50%) rotate(2deg) scale(1.03,.97) } }
    @media (prefers-reduced-motion:reduce) { *,*:before,*:after { animation:none!important; transition:none!important; scroll-behavior:auto!important } }
  </style>
</head>
<body>
  <div class="decor" aria-hidden="true">
    <span class="star">✦</span><span class="heart">♥</span><span class="heart">♥</span><span class="star">✦</span>
    <span class="star">✦</span><span class="heart">♥</span><span class="heart">♥</span><span class="star">✦</span>
    <span class="star">✦</span><span class="heart">♥</span><span class="star">✦</span><span class="heart">♥</span>
    <span class="heart">♥</span><span class="star">✦</span><span class="star">✦</span><span class="heart">♥</span>
    <span class="heart">♥</span><span class="star">✦</span><span class="star">✦</span><span class="heart">♥</span>
    <span class="heart">♥</span><span class="star">✦</span>
  </div>
  <main id="candlePage">
    <p class="eyebrow">Hoy llega a este mundo nuestro pequeño</p>
    <h1>EKYAM</h1>
    <p class="intro">Te pedimos que hagas una pausa, piensa en aquello que deseas para nuestro hijo y enciende esta pequeña luz.</p>
    <section class="scene" aria-label="Vela virtual">
      <div class="glow" aria-hidden="true"></div>
      <button class="candle-button" id="lightButton" type="button" aria-label="Encender la vela" aria-pressed="false">
        <span class="flame" aria-hidden="true"></span><span class="wick" aria-hidden="true"></span>
        <span class="wax" aria-hidden="true"></span><span class="drip" aria-hidden="true"></span>
        <span class="base" aria-hidden="true"></span><span class="tap-hint" id="hint">Toca la vela para encenderla</span>
      </button>
    </section>
    <form class="wish" id="wishForm">
      <label for="name">Tu nombre <span style="color:#8299a8">(opcional)</span></label>
      <input id="name" name="name" maxlength="60" placeholder="¿Cómo te llamas?" autocomplete="name">
      <label for="wishText">Si quieres, escribe tu deseo y nosotros lo leeremos para él</label>
      <textarea id="wishText" name="message" maxlength="500" placeholder="Tu deseo para Ekyam…" autocomplete="off" required></textarea>
      <label class="honeypot" aria-hidden="true" for="website">No rellenes este campo</label>
      <input class="honeypot" id="website" name="website" tabindex="-1" autocomplete="off">
      <button class="save-button" id="saveButton" type="submit">Guardar mi deseo</button>
      <p class="status" id="saveStatus" role="status" aria-live="polite"></p>
    </form>
    <p class="note">Los deseos guardados solo estarán disponibles para la familia desde el panel privado de la base de datos.</p>
  </main>
  <script>
    const page = document.getElementById('candlePage');
    const button = document.getElementById('lightButton');
    const hint = document.getElementById('hint');
    button.addEventListener('click', () => {
      const lit = page.classList.toggle('lit');
      button.setAttribute('aria-pressed', String(lit));
      button.setAttribute('aria-label', lit ? 'Apagar la vela' : 'Encender la vela');
      hint.textContent = lit ? 'La luz está encendida · toca para apagarla' : 'Toca la vela para encenderla';
    });
    // Completa estos valores cuando crees el proyecto de Supabase.
    const SUPABASE_URL = 'PEGA_AQUI_LA_URL_DE_TU_PROYECTO';
    const SUPABASE_PUBLISHABLE_KEY = 'PEGA_AQUI_TU_CLAVE_PUBLICA';
    const isConfigured = SUPABASE_URL.startsWith('https://') && !SUPABASE_URL.includes('PEGA_AQUI') && !SUPABASE_PUBLISHABLE_KEY.includes('PEGA_AQUI');
    const form = document.getElementById('wishForm');
    const saveButton = document.getElementById('saveButton');
    const saveStatus = document.getElementById('saveStatus');
    if (!isConfigured) {
      saveButton.disabled = true;
      saveStatus.textContent = 'El buzón se activará cuando se conecte la base de datos.';
    } else {
      const script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
      script.onload = () => {
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
        form.addEventListener('submit', async (event) => {
          event.preventDefault();
          if (document.getElementById('website').value) return;
          const message = document.getElementById('wishText').value.trim();
          const name = document.getElementById('name').value.trim();
          if (!message) return;
          saveButton.disabled = true;
          saveStatus.textContent = 'Guardando tu deseo…';
          const { error } = await supabase.from('wishes').insert({ display_name: name || null, message });
          saveButton.disabled = false;
          if (error) {
            saveStatus.textContent = 'No se pudo guardar. Inténtalo de nuevo en un momento.';
          } else {
            form.reset();
            saveStatus.textContent = 'Tu deseo ha quedado guardado para Ekyam. Gracias por compartirlo.';
          }
        });
      };
      script.onerror = () => { saveStatus.textContent = 'No se pudo cargar el servicio de guardado. Inténtalo más tarde.'; };
      document.head.appendChild(script);
    }
  </script>
</body>
</html>
